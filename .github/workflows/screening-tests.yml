name: Screening validator regression tests
on:
  push:
    branches: [main]
    paths: ['brief_rules.md', 'scripts/validate_stock_screening.py', 'scripts/fetch_us_rankings_snapshot.py', 'tests/test_ah_policy_v2.py', 'tests/test_stock_screening.py', 'tests/test_us_rankings_snapshot.py', '.github/workflows/screening-tests.yml']
  pull_request:
    paths: ['brief_rules.md', 'scripts/validate_stock_screening.py', 'scripts/fetch_us_rankings_snapshot.py', 'tests/test_ah_policy_v2.py', 'tests/test_stock_screening.py', 'tests/test_us_rankings_snapshot.py', '.github/workflows/screening-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stock_screening.py' -v
      - run: python -m unittest discover -s tests -p 'test_us_rankings_snapshot.py' -v
      - run: python -m unittest discover -s tests -p 'test_ah_policy_v2.py' -v
