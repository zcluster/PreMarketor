name: Refresh US rankings snapshot

on:
  workflow_dispatch:
  schedule:
    # 06:45 Asia/Shanghai Tuesday-Saturday, after the corresponding US close.
    - cron: "45 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: us-rankings-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test snapshot contract
        run: python -m unittest tests/test_us_rankings_snapshot.py -v

      - name: Install browser driver
        run: python -m pip install playwright==1.55.0

      - name: Capture only required ranking rows
        run: python scripts/fetch_us_rankings_snapshot.py --output data/us-rankings-latest.json

      - name: Publish snapshot and attempt status
        run: |
          if [ -z "$(git status --porcelain -- data/us-rankings-latest.json)" ]; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-rankings-latest.json
          git commit -m "Refresh US rankings snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report total source failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("data/us-rankings-latest.json").read_text())
          if snapshot["status"] == "error":
              raise SystemExit("Both ranking groups failed; last successes were retained separately")
          PY
