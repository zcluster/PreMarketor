name: Refresh US rankings snapshot

on:
  workflow_dispatch:
  schedule:
    # 05:17, 06:17 and 07:17 Asia/Shanghai Tuesday-Saturday.
    # All are after the US close in both DST and standard time; later runs are backups.
    - cron: "17 21-23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: us-rankings-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test snapshot contract
        run: python -m unittest tests/test_us_rankings_snapshot.py tests/test_us_rankings_panel.py -v

      - name: Install browser driver
        run: python -m pip install playwright==1.55.0

      - name: Capture only required ranking rows
        run: |
          cp data/us-rankings-latest.json "$RUNNER_TEMP/us-rankings-captured.json"
          python scripts/fetch_us_rankings_snapshot.py --output "$RUNNER_TEMP/us-rankings-captured.json"

      - name: Publish snapshot and attempt status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            cp "$RUNNER_TEMP/us-rankings-captured.json" data/us-rankings-latest.json
            python scripts/update_us_rankings_panel.py
            if [ -z "$(git status --porcelain -- data/us-rankings-latest.json index.html)" ]; then
              echo "No ranking change"
              exit 0
            fi
            git add data/us-rankings-latest.json index.html
            git commit -m "Refresh US rankings snapshot and homepage panels"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Main changed during all three publish attempts"
          exit 1

      - name: Report total source failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("data/us-rankings-latest.json").read_text())
          if snapshot["status"] == "error":
              raise SystemExit("Both ranking groups failed; last successes were retained separately")
          PY
