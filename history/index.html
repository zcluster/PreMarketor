<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketAhead | 历史简报</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--soft:#f9fafb;--ink:#151d26;--muted:#687585;--line:#dce3eb;--teal:#007481;--amber:#b45309;--green:#087f5b;--red:#b42318;--shadow:0 18px 48px rgba(20,31,44,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.58}main{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:24px 0 48px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;padding:18px 20px}.top a{color:var(--teal);font-weight:700;text-decoration:none}.muted{color:var(--muted);font-size:13px}.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.module{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:14px;margin-bottom:12px}.module.full{grid-column:1/-1}.module h3{margin:0 0 10px;font-size:16px}.entry{padding:0;overflow:hidden}.entry>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:780}.entry>summary::-webkit-details-marker{display:none}.entry-body{padding:0 18px 18px}.news-list{display:grid;gap:8px}.news-item{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}.news-item>div{min-width:0}.news-tag{border-radius:999px;padding:3px 8px;text-align:center;font-size:12px;font-weight:750}.news-tag.geo{background:#fff0ee;color:var(--red)}.news-tag.tech{background:#eef6f3;color:var(--green)}.news-tag.earn{background:#fff6e8;color:var(--amber)}.news-title{font-weight:740;overflow-wrap:anywhere}.news-detail{color:var(--muted);font-size:13px;margin-top:2px}.takeaway{border-left:4px solid var(--teal);background:#f1fbfc}.risk-list{display:grid;gap:8px}.risk-item{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;font-size:13px}.risk-dot{width:8px;height:8px;border-radius:999px;margin-top:7px;background:var(--amber)}.risk-dot.high{background:var(--red)}.source-line{color:var(--muted);font-size:12px}.empty{padding:22px;color:var(--muted)}@media(max-width:900px){.brief-grid{grid-template-columns:1fr}.top{flex-direction:column}.news-item{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="top panel"><div><h1 id="page-title">历史简报</h1><div class="muted" id="page-meta">正在读取归档数据...</div></div><a href="../">返回首页</a></section>
  <section id="archive-root" class="brief-grid"><div class="panel empty">加载中...</div></section>
</main>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var date = params.get('date') || '';
  var root = document.getElementById('archive-root');
  var title = document.getElementById('page-title');
  var meta = document.getElementById('page-meta');
  function esc(text){return String(text == null ? '' : text).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
  function renderEntry(entry){
    return '<details class="panel entry" open><summary>'+esc(entry.label || entry.type || '简报')+'</summary><div class="entry-body">'+(entry.html || '')+'</div></details>';
  }
  function cleanNewsTitlePrefixes(scope){
    var root = scope || document;
    var nodes = Array.prototype.slice.call(root.querySelectorAll('.news-title,.stock-name,[class*="title"],[class*="headline"],[class*="flash"]'));
    nodes.forEach(function(node){
      if(/^(SCRIPT|STYLE|TIME|CODE)$/i.test(node.tagName)){return;}
      var first = node.firstChild;
      if(!first || first.nodeType !== 3){return;}
      var text = first.nodeValue || '';
      var cleaned = text.replace(/^\s*(?:\d{1,2})?[:：]\d{2,4}\s*/, '').replace(/^\s*\d{1,2}[.、]\s*/, '');
      if(cleaned && cleaned !== text){first.nodeValue = cleaned;}
    });
  }
  function render(data){
    title.textContent = data.title || (data.date + ' 历史简报');
    meta.textContent = [data.date, data.updated, data.summary].filter(Boolean).join(' · ');
    root.innerHTML = (data.entries || []).map(renderEntry).join('') || '<div class="panel empty">这个日期暂无归档内容。</div>';
    cleanNewsTitlePrefixes(root);
    document.title = 'MarketAhead | ' + (data.date || '历史简报');
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
    root.innerHTML = '<div class="panel empty">请从首页日历选择一个日期。</div>';
    meta.textContent = '未选择日期';
    return;
  }
  fetch('data/' + date + '.json', {cache:'no-store'}).then(function(res){
    if(!res.ok){throw new Error('not found');}
    return res.json();
  }).then(render).catch(function(){
    root.innerHTML = '<div class="panel empty">没有找到 '+esc(date)+' 的归档文件。</div>';
    title.textContent = date + ' 历史简报';
    meta.textContent = '归档文件缺失';
  });
})();
</script>
</body>
</html>
